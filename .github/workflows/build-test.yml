name: FPP CI

on:
  push:
    branches: [ "main", "release/**" ]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event.pull_request.draft == false

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'sbt'
    - name: Install Scala
      run: |
        curl -fL https://github.com/coursier/launchers/raw/master/cs-x86_64-pc-linux.gz | gzip -d > cs
        chmod +x cs
        echo Y | ./cs setup
    - name: Install fpp tools
      run: compiler/install
    - name: Run sbt tests
      run: |
        cd compiler/
        sbt test
    # The full fpp test suite on the JVM is slow, so skip it on PRs.
    # PRs still run the full suite against the native images
    # (see build-native.yml). The JVM suite runs on merges into main and
    # release branches, and it can be run manually via workflow_dispatch.
    - name: Run fpp smoke tests
      if: github.event_name == 'pull_request'
      run: |
        cd compiler/
        for tool in fpp `sed 's/^/fpp-/' tools.txt`
        do
          bin/$tool --help > /dev/null < /dev/null || exit 1
          echo "$tool --help: ok"
        done
    - name: Run fpp tests
      if: github.event_name != 'pull_request'
      run: |
        export PATH=~/.local/share/coursier/bin:$PATH
        cd compiler/
        ./test
    - name: Clean up
      run: |
        cd compiler/
        ./clean
